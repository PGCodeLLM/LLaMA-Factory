services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ipc: host          # mounts the host’s /dev/shm (fast & easy) 
    shm_size: "2g"     # optional if you prefer an isolated namespace

    # Tell Compose to reserve the eight GPUs you’re asking for
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8          # must match --tensor-parallel-size
              capabilities: [ gpu ]

    ports:
      - "8108:8000"
    env_file: .env
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      VLLM_API_KEY: ${INFORMED_CRAWLER_API_KEY}
      VLLM_GPU_MEMORY_UTILIZATION: 0.95

      # (optional) keep these while debugging
      NCCL_DEBUG: INFO
      NCCL_P2P_LEVEL: PXB   # avoids some P2P/IOMMU issues
      NCCL_IB_DISABLE: "1"  # disable RDMA if you don’t have it

    volumes:
      - "/home/original_models:/root/.cache/huggingface"

    entrypoint: ["vllm", "serve"]
    command:
      - Qwen/Qwen3-235B-A22B
      - --tensor-parallel-size
      - "8"
      - --dtype
      - bfloat16
      - --host
      - 0.0.0.0
      - --api-key
      - ${INFORMED_CRAWLER_API_KEY}
      - --enable-auto-tool-choice
      - --tool-call-parser 
      - pythonic
