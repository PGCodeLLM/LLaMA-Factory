### model
model_name_or_path: /home/original_models/DeepSeek-R1-Distill-Qwen-32B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### dataset
dataset: pangu_sft
template: deepseekr1
cutoff_len: 20480
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /shared_workspace_mfs/alex/llama-factory-chkpts/DeepSeek-R1-Distill-Qwen-32B/full/DeepSeek-R1-Distill-Qwen-32B
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: llama_factory_r2e_DeepSeek-R1-Distill-Qwen-32B

### train
flash_attn: fa2
enable_liger_kernel: true
use_unsloth_gc: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
ddp_timeout: 180000000

